[package]
name = "suyan-core"
version = "0.1.0"
edition = "2021"
description = "素言 (SuYan) Rust core sidecar: file/media/index/archive/task processing"
license = "MIT"

[[bin]]
name = "suyan-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.17"
jpeg-encoder = "0.7"
webp = "0.3.1"
tokio = { version = "1.0", features = ["rt-multi-thread", "io-std", "io-util", "sync", "time", "macros", "process"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true